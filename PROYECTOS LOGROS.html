 <!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>PROYECTOS LOGROS</title>
<style>
  :root{
    --bg:#070d1a; --bg2:#0d1830; --ink:#f2f7ff; --muted:#9fb2cc;
    --card:rgba(255,255,255,.045); --line:rgba(255,255,255,.12);
    --accent:#3fd0d8;      /* teal */
    --accent2:#57e39b;     /* emerald */
    --gold:#f5c451;        /* highlight logros */
    --shadow:rgba(0,0,0,.55);
  }
  html[data-theme="light"]{
    --bg:#eef2f8; --bg2:#dfe8f3; --ink:#0f1b2d; --muted:#4a5b72;
    --card:rgba(10,25,50,.04); --line:rgba(10,25,50,.14);
    --accent:#128a97; --accent2:#159463; --gold:#b8860b; --shadow:rgba(20,40,70,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);
    background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased;
  }
  /* animated backdrop */
  #bgfx{position:fixed;inset:0;z-index:0;overflow:hidden;background:
     radial-gradient(1100px 700px at 15% 0%,var(--bg2),transparent 60%),
     radial-gradient(900px 600px at 100% 100%,rgba(63,208,216,.10),transparent 55%),
     var(--bg);}
  #bgfx::before,#bgfx::after{content:"";position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;}
  #bgfx::before{width:46vw;height:46vw;left:-10vw;bottom:-14vw;
     background:radial-gradient(circle,var(--accent),transparent 62%);animation:float1 22s ease-in-out infinite;}
  #bgfx::after{width:38vw;height:38vw;right:-8vw;top:-12vw;
     background:radial-gradient(circle,var(--accent2),transparent 62%);animation:float2 26s ease-in-out infinite;}
  @keyframes float1{50%{transform:translate(8vw,-6vw) scale(1.15);}}
  @keyframes float2{50%{transform:translate(-6vw,7vw) scale(1.1);}}
  @media (prefers-reduced-motion:reduce){#bgfx::before,#bgfx::after{animation:none;}}

  #stage{position:fixed;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;padding:6vh 6vw;}
  .slide{
    position:absolute;width:min(1060px,90vw);max-height:88vh;overflow:auto;
    background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
    border:1px solid var(--line);border-radius:24px;padding:clamp(26px,4.5vw,60px);
    box-shadow:0 40px 90px -25px var(--shadow),inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter:blur(10px);
    opacity:0;transform:translateY(30px) scale(.975);pointer-events:none;
    transition:opacity .5s ease,transform .55s cubic-bezier(.16,.8,.2,1);
    scrollbar-width:thin;
  }
  .slide.active{opacity:1;transform:none;pointer-events:auto;}

  .kicker{font-size:.74rem;font-weight:800;letter-spacing:.24em;text-transform:uppercase;
    color:var(--accent);display:flex;align-items:center;gap:12px;margin-bottom:18px;}
  .kicker::before{content:"";width:32px;height:2px;background:linear-gradient(90deg,var(--accent),transparent);}
  h1{font-size:clamp(2rem,5.4vw,3.8rem);line-height:1.05;letter-spacing:-.02em;margin-bottom:14px;}
  h2{font-size:clamp(1.5rem,3.4vw,2.4rem);line-height:1.12;letter-spacing:-.015em;margin-bottom:20px;}
  h3{font-size:.82rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px;}
  p{margin:11px 0;max-width:66ch;color:var(--ink);}
  .lead{font-size:clamp(1.05rem,2vw,1.3rem);color:var(--muted);line-height:1.5;}
  ul,ol{margin:12px 0 12px 1.25em;}
  li{margin:9px 0;}li::marker{color:var(--accent);}
  strong{color:var(--ink);}
  .hl{color:var(--gold);font-weight:700;}

  /* hero metric */
  .hero{display:flex;flex-wrap:wrap;align-items:baseline;gap:16px;margin:8px 0 6px;}
  .hero .big{font-size:clamp(3.4rem,12vw,8rem);font-weight:800;line-height:.9;letter-spacing:-.03em;
    background:linear-gradient(120deg,var(--accent),var(--accent2) 55%,var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .hero .unit{font-size:clamp(1rem,2.4vw,1.5rem);color:var(--muted);font-weight:600;}
  .badge{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;
    background:color-mix(in srgb,var(--gold) 18%,transparent);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);
    color:var(--gold);font-weight:800;font-size:.85rem;letter-spacing:.04em;}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin:22px 0;}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;position:relative;overflow:hidden;}
  .kpi::after{content:"";position:absolute;left:0;top:0;height:3px;width:100%;
    background:linear-gradient(90deg,var(--accent),var(--accent2));opacity:.9;}
  .kpi .v{font-size:clamp(1.7rem,4vw,2.6rem);font-weight:800;letter-spacing:-.02em;
    background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .kpi.gold .v{background:linear-gradient(90deg,var(--gold),#ffe08a);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .kpi.gold::after{background:linear-gradient(90deg,var(--gold),#ffe08a);}
  .kpi .l{font-size:.85rem;color:var(--muted);margin-top:6px;line-height:1.35;}

  .agenda{list-style:none;margin:0;display:grid;gap:12px;}
  .agenda li{display:flex;gap:18px;align-items:flex-start;background:var(--card);
    border:1px solid var(--line);border-radius:14px;padding:16px 18px;}
  .agenda b{color:var(--gold);font-size:1.15rem;font-weight:800;min-width:1.7em;}

  /* stagger entrance */
  .slide.active [data-anim]{animation:rise .6s cubic-bezier(.16,.8,.2,1) both;}
  .slide.active [data-anim="1"]{animation-delay:.05s} .slide.active [data-anim="2"]{animation-delay:.13s}
  .slide.active [data-anim="3"]{animation-delay:.21s} .slide.active [data-anim="4"]{animation-delay:.29s}
  .slide.active [data-anim="5"]{animation-delay:.37s} .slide.active [data-anim="6"]{animation-delay:.45s}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.slide.active [data-anim]{animation:none;}}

  /* chrome */
  #bar{position:fixed;top:0;left:0;height:3px;z-index:20;width:0;
    background:linear-gradient(90deg,var(--accent),var(--accent2),var(--gold));transition:width .5s ease;}
  #dots{position:fixed;right:16px;top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;gap:10px;}
  #dots button{width:10px;height:10px;border-radius:50%;border:0;cursor:pointer;padding:0;
    background:var(--line);transition:transform .2s ease,background .2s ease;}
  #dots button.on{background:linear-gradient(90deg,var(--accent),var(--accent2));transform:scale(1.5);}
  @media (max-width:720px){#dots{display:none;}}
  #hud{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-between;align-items:center;
    padding:14px 20px;font-size:.82rem;color:var(--muted);pointer-events:none;}
  #hud .t{font-weight:700;color:var(--ink);opacity:.75;max-width:60vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .btns{display:flex;gap:8px;pointer-events:auto;}
  .nav{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);cursor:pointer;font-size:1.05rem;
    background:rgba(255,255,255,.06);color:var(--ink);transition:transform .15s ease;}
  .nav:hover{transform:translateY(-2px);}
  #count{min-width:66px;text-align:center;font-variant-numeric:tabular-nums;cursor:pointer;pointer-events:auto;}
  .topbtns{position:fixed;top:14px;right:16px;z-index:40;display:flex;gap:8px;}
  .topbtns button{height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);cursor:pointer;
    background:rgba(255,255,255,.06);color:var(--ink);font-size:.8rem;}
  .hint{position:fixed;left:20px;top:16px;z-index:20;font-size:.74rem;color:var(--muted);}
  @media (max-width:720px){.hint{display:none;}}

  #grid{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;overflow:auto;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;padding:6vh 5vw;align-content:start;}
  #grid.show{display:grid;}
  .thumb{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;cursor:pointer;min-height:150px;
    transition:transform .15s ease,border-color .15s ease;}
  .thumb:hover{transform:translateY(-4px);border-color:var(--accent);}
  .thumb .n{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:800;}
  .thumb .h{margin-top:10px;font-weight:700;line-height:1.25;}

  /* metodología / propuesta de valor */
  .value{font-size:clamp(1.4rem,3vw,2.15rem);line-height:1.2;letter-spacing:-.015em;margin:6px 0 4px;
    background:linear-gradient(120deg,var(--accent),var(--accent2) 55%,var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent;max-width:22ch;}
  .method{list-style:none;margin:26px 0 0;display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;}
  .method li{position:relative;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:18px 16px;overflow:hidden;}
  .method li::after{content:"";position:absolute;left:0;top:0;height:3px;width:100%;
    background:linear-gradient(90deg,var(--accent),var(--accent2));opacity:.9;}
  .method .s{font-size:.72rem;font-weight:800;letter-spacing:.18em;color:var(--accent);}
  .method b{display:block;margin:8px 0 5px;font-size:1.05rem;color:var(--ink);letter-spacing:-.01em;}
  .method .d{font-size:.82rem;color:var(--muted);line-height:1.35;}
  .flow{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 0;font-size:.9rem;font-weight:700;color:var(--muted);}
  .flow span{display:inline-flex;align-items:center;gap:8px;}
  .flow span::after{content:"→";color:var(--accent);}
  .flow span:last-child::after{content:"";}

  @media print{
    #bgfx,#bar,#hud,#dots,#grid,.topbtns,.hint{display:none!important;}
    body{overflow:visible;background:#fff;}
    #stage{position:static;display:block;padding:0;}
    .slide{position:static;opacity:1;transform:none;max-height:none;width:100%;backdrop-filter:none;
      box-shadow:none;border:0;border-bottom:1px solid #ccc;border-radius:0;page-break-after:always;color:#000;}
    .hero .big,.kpi .v{-webkit-text-fill-color:#0a5;}
  }
</style>
</head>
<body>
<div id="bgfx"></div>
<div id="bar"></div>
<div class="hint">← →  navegar · O  vista general · F  pantalla completa</div>
<div class="topbtns">
  <button id="themeBtn" title="Tema">◐</button>
  <button id="fsBtn" title="Pantalla completa">⛶</button>
  <button id="ovBtn" title="Vista general">▦</button>
</div>

<div id="stage"></div>
<div id="dots"></div>

<div id="hud">
  <span class="t" id="hudTitle"></span>
  <div class="btns">
    <button class="nav" id="prev" aria-label="Anterior">‹</button>
    <span id="count">1 / 1</span>
    <button class="nav" id="next" aria-label="Siguiente">›</button>
  </div>
</div>

<div id="grid"></div>

<script>

const stage=document.getElementById('stage');
const grid=document.getElementById('grid');
const dots=document.getElementById('dots');
const bar=document.getElementById('bar');
const countEl=document.getElementById('count');
const hudTitle=document.getElementById('hudTitle');
let cur=0;

SLIDES.forEach((s,i)=>{
  const el=document.createElement('article');
  el.className='slide';el.dataset.i=i;el.innerHTML=s.body;
  stage.appendChild(el);

  const d=document.createElement('button');
  d.title=s.h;d.onclick=()=>go(i);dots.appendChild(d);

  const t=document.createElement('div');
  t.className='thumb';
  t.innerHTML=`<div class="n">${s.n}</div><div class="h">${s.h}</div>`;
  t.onclick=()=>{go(i);toggleGrid(false);};
  grid.appendChild(t);
});
const slideEls=[...document.querySelectorAll('.slide')];
const dotEls=[...dots.children];

function render(){
  slideEls.forEach((el,i)=>el.classList.toggle('active',i===cur));
  dotEls.forEach((d,i)=>d.classList.toggle('on',i===cur));
  bar.style.width=((cur+1)/SLIDES.length*100)+'%';
  countEl.textContent=`${cur+1} / ${SLIDES.length}`;
  hudTitle.textContent=SLIDES[cur].h;
  location.hash=cur+1;
  animateCounters(slideEls[cur]);
}
function go(i){cur=Math.max(0,Math.min(SLIDES.length-1,i));render();}
const nextS=()=>go(cur+1), prevS=()=>go(cur-1);

function animateCounters(slide){
  slide.querySelectorAll('[data-count]').forEach(el=>{
    const raw=+el.dataset.count;
    const scale=el.dataset.scale?+el.dataset.scale:1;
    const target=raw;
    const suf=el.dataset.suffix||'';
    const dur=1000, t0=performance.now();
    const fmt=v=>{
      if(scale!==1) return (v/scale).toLocaleString('es',{minimumFractionDigits:1,maximumFractionDigits:1});
      return v.toLocaleString('es');
    };
    el.textContent='0'+suf;
    function step(t){
      const p=Math.min(1,(t-t0)/dur);
      const v=Math.round(target*(1-Math.pow(1-p,3)));
      el.textContent=fmt(v)+suf;
      if(p<1) requestAnimationFrame(step); else el.textContent=fmt(target)+suf;
    }
    requestAnimationFrame(step);
  });
}

function toggleGrid(force){
  const show=force!==undefined?force:!grid.classList.contains('show');
  grid.classList.toggle('show',show);
}

document.getElementById('next').onclick=nextS;
document.getElementById('prev').onclick=prevS;
document.getElementById('ovBtn').onclick=()=>toggleGrid();
document.getElementById('count').onclick=()=>toggleGrid(true);
document.getElementById('fsBtn').onclick=()=>{
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
};
document.getElementById('themeBtn').onclick=()=>{
  const c=document.documentElement.getAttribute('data-theme');
  const n=c==='light'?'dark':'light';
  document.documentElement.setAttribute('data-theme',n);
  try{localStorage.setItem('deck-theme',n);}catch(e){}
};
try{const st=localStorage.getItem('deck-theme'); if(st) document.documentElement.setAttribute('data-theme',st);}catch(e){}

window.addEventListener('keydown',e=>{
  if(['ArrowRight','PageDown',' '].includes(e.key)){nextS();e.preventDefault();}
  else if(['ArrowLeft','PageUp'].includes(e.key)){prevS();e.preventDefault();}
  else if(e.key==='Home')go(0);
  else if(e.key==='End')go(SLIDES.length-1);
  else if(e.key.toLowerCase()==='o')toggleGrid();
  else if(e.key.toLowerCase()==='f')document.getElementById('fsBtn').click();
  else if(e.key==='Escape')toggleGrid(false);
});

let tx=0;
stage.addEventListener('touchstart',e=>tx=e.changedTouches[0].clientX,{passive:true});
stage.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>50) dx<0?nextS():prevS();
},{passive:true});
stage.addEventListener('click',e=>{
  if(e.target.closest('a,button,li,ul,ol')) return;
  const x=e.clientX/window.innerWidth;
  if(x>0.62) nextS(); else if(x<0.38) prevS();
});

const fromHash=parseInt(location.hash.replace('#',''),10);
cur=(fromHash>=1&&fromHash<=SLIDES.length)?fromHash-1:0;
render();
</script>
</body>
</html>
